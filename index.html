<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing-Depot</title>
<meta name="theme-color" content="#1f5fa8">
<meta name="description" content="Depot-Kopie, Beobachtungsliste und Regel-Bewertung für Swingtrading.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Aufbau: eine Spalte, Kopfzeile oben, Reiter unten. Karten (.card) sind das einzige Gestaltungselement für Inhalte. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #e8edf2; --fg: #15202b; --muted: #5a6776; --line: #d6dde5;
  --accent: #1f5fa8; --accent-fg: #ffffff; --accent-soft: #e1ecf8;
  --buy: #0f7a57; --buy-bg: #dbf1e7; --wait: #8f5b00; --wait-bg: #fbeed3; --no: #b0323a; --no-bg: #f8e0e1;
  --chart-close: #15202b; --chart-20: #1f5fa8; --chart-50: #a8569f; --chart-200: #8a96a3;
  --radius: 14px; --gap: 14px;
  --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #172029; --surface-2: #202b37; --fg: #e5ebf1; --muted: #93a1b0; --line: #2a3644;
    --accent: #6ea8ec; --accent-fg: #0a1520; --accent-soft: #1b2f47;
    --buy: #4cc796; --buy-bg: #12332a; --wait: #e6b04a; --wait-bg: #372a12; --no: #ef7f84; --no-bg: #3a1b1f;
    --chart-close: #e5ebf1; --chart-20: #6ea8ec; --chart-50: #d69bd8; --chart-200: #7a8796;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #172029; --surface-2: #202b37; --fg: #e5ebf1; --muted: #93a1b0; --line: #2a3644;
  --accent: #6ea8ec; --accent-fg: #0a1520; --accent-soft: #1b2f47;
  --buy: #4cc796; --buy-bg: #12332a; --wait: #e6b04a; --wait-bg: #372a12; --no: #ef7f84; --no-bg: #3a1b1f;
  --chart-close: #e5ebf1; --chart-20: #6ea8ec; --chart-50: #d69bd8; --chart-200: #7a8796;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.up { color: var(--buy); } .down { color: var(--no); }

/* Grundgerüst */
.app { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: max(12px, env(safe-area-inset-top, 0px)) 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top h1 { font-size: 21px; }
header.top .meta { font-size: 12px; color: var(--muted); text-align: right; }
main { display: flex; flex-direction: column; gap: var(--gap); padding-top: 6px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.section-head h2 { font-size: 18px; }

/* Karten */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-size: 16px; display: flex; align-items: center; gap: 6px; }
.card.tap { text-align: left; width: 100%; font: inherit; color: inherit; }
.card.accent { background: var(--accent-soft); border-color: transparent; }
.card.kaufen { border-left: 4px solid var(--buy); }
.card.nicht { border-left: 4px solid var(--no); }
.card.abwarten { border-left: 4px solid var(--wait); }
.list { display: flex; flex-direction: column; gap: 10px; }
.empty { text-align: center; padding: 22px 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; border-radius: 12px; font-size: 15px; font-weight: 500; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.danger { color: var(--no); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 36px; padding: 0 14px; font-size: 14px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.info { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; padding: 0; line-height: 1; vertical-align: middle; }

/* Signale */
.pill { display: inline-block; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.kaufen { background: var(--buy-bg); color: var(--buy); }
.pill.abwarten { background: var(--wait-bg); color: var(--wait); }
.pill.nicht { background: var(--no-bg); color: var(--no); }
.pill.none { background: var(--surface-2); color: var(--muted); }

/* Aktien-Zeile */
.stock { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.stock .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stock .sub { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.stock .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.stock .why { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
svg.spark { width: 72px; height: 24px; display: block; }

/* Zahlen-Kacheln */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stats > div { background: var(--surface); padding: 11px 13px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.stats .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 17px; }
.stats .big { grid-column: 1 / -1; }
.stats .big .v { font-size: 26px; font-family: var(--font-display); font-weight: 600; }
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.plan > div { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; display: flex; flex-direction: column; min-width: 0; }
.plan .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.plan .v { font-family: var(--font-mono); font-size: 16px; font-variant-numeric: tabular-nums; }
.plan .s { font-size: 12px; color: var(--muted); }

/* Bewertung */
.verdict { border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.verdict.kaufen { background: var(--buy-bg); } .verdict.abwarten { background: var(--wait-bg); } .verdict.nicht { background: var(--no-bg); } .verdict.none { background: var(--surface-2); }
.verdict .head { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.verdict.kaufen .head { color: var(--buy); } .verdict.abwarten .head { color: var(--wait); } .verdict.nicht .head { color: var(--no); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.checks .ok { color: var(--buy); font-weight: 600; } .checks .bad { color: var(--no); font-weight: 600; } .checks .na { color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* Tabellen */
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t .r { text-align: right; white-space: nowrap; }
table.t td.num { white-space: nowrap; }

/* Formulare */
form.f { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
form.f label, .field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
form.f .full { grid-column: 1 / -1; }
.lab { display: flex; align-items: center; gap: 4px; min-height: 22px; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 8px 11px; font-size: 16px; width: 100%; min-width: 0; color: var(--fg); }
.check { flex-direction: row !important; align-items: center; gap: 10px !important; font-size: 15px !important; color: var(--fg) !important; }
.check input { width: 22px; min-height: 22px; height: 22px; flex: none; }
details > summary { cursor: pointer; font-weight: 600; font-family: var(--font-display); list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
details > summary::after { content: "▾"; color: var(--muted); transition: transform .15s; }
details[open] > summary::after { transform: rotate(180deg); }
details > summary::-webkit-details-marker { display: none; }

/* Diagramm */
.chart-wrap svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* Reiter unten */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 600px; margin: 0 auto; }
nav.tabs button { background: none; border: 0; padding: 8px 2px 9px; font-size: 12px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); }
nav.tabs .dot { position: absolute; top: 5px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--no); }

/* Vollbild-Seiten, Hinweisfenster, Meldungen */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); }
.sheet .app { padding-block: 0 calc(40px + env(safe-area-inset-bottom, 0px)); }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.sheet-head h2 { font-size: 19px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { display: flex; flex-direction: column; gap: var(--gap); padding-top: 6px; }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 20, 0.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay .box { background: var(--surface); border-radius: 18px; padding: 18px; max-width: 520px; width: 100%; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; }
.overlay .box h3 { font-size: 19px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .card.tap { transition: background-color .15s, border-color .15s, transform .1s; } .card.tap:active { transform: scale(0.99); } }
@media (max-width: 370px) { .plan { grid-template-columns: repeat(2, minmax(0, 1fr)); } nav.tabs button { font-size: 11px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Swing-Depot</h1>
    <div class="meta" id="headerMeta">Lade…</div>
  </header>

  <main id="view-today"></main>
  <main id="view-list" hidden></main>
  <main id="view-depot" hidden></main>
  <main id="view-paper" hidden></main>
  <main id="view-more" hidden></main>
</div>

<nav class="tabs" role="tablist" aria-label="Bereiche">
  <div class="inner">
    <button role="tab" id="tab-today" aria-selected="true" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute<span class="dot" id="todayDot" hidden></span></button>
    <button role="tab" id="tab-list" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Liste</button>
    <button role="tab" id="tab-depot" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h.01M3 10h18M7 6V4h10v2"/></svg>Depot</button>
    <button role="tab" id="tab-paper" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg>Papier</button>
    <button role="tab" id="tab-more" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Mehr</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="app">
    <div class="sheet-head"><button class="btn small" id="sheetBack" type="button" aria-label="Zurück">← Zurück</button><h2 id="sheetTitle"></h2></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="overlay" id="overlay" hidden><div class="box" id="overlayBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
